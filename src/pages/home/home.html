<main class="text-center pt-20">
  <h1 class="text-3xl font-bold mb-4">{{ title() }}</h1>

  <div>
    <p class="text-lg mb-4">Welcome to the {{ title() }} page!</p>
  </div>
  <form>
    <!-- <label for="name">Name:</label> -->
    <div class="flex justify-center space-x-2">
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Buscar Cliente pelo nome"
        class="border border-gray-300 rounded px-4 py-2"
      />
      <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white px-4 py-2 rounded">
        Submit
      </button>
      <button type="button" class="bg-gray-500 hover:bg-gray-700 text-white px-4 py-2 rounded">
        Limpar
      </button>
    </div>
  </form>
  <section class="border p-4 mx-6 h-80 border-gray-300 mt-4">
    <table class="w-full border-collapse border border-gray-300">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th class="hidden sm:inline-block">Cadastro</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        @for (item of clientes; track item.id) {
          <tr>
            <td>{{ item.nome }}</td>
            <td>{{ item.email }}</td>
            <td>{{ item.telefone }}</td>
            <td class="hidden sm:inline-block">{{ item.dataCadastro }}</td>
            <td>
              <button class="bg-blue-500 hover:bg-blue-700 text-white px-2 py-1 rounded">
                Edit
              </button>
              <button class="bg-red-500 hover:bg-red-700 text-white px-2 py-1 rounded">
                Delete
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="text-center">Nenhum registro encontrado.</td>
          </tr>
        }
      </tbody>
    </table>
  </section>
</main>
