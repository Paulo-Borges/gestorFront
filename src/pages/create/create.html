<main class="text-center pt-20">
  <h1 class="text-3xl font-bold mb-4">{{ title() }}</h1>

  <div>
    <p class="text-lg mb-4">Welcome to the {{ title() }} page!</p>
  </div>
  <section class="border p-4 mx-6 h-80 border-gray-300">
    <form>
      <div class="flex flex-col space-y-2">
        <div class="flex flex-col items-start space-y-2">
          <label for="name" class="block mb-2">Name:</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            class="border border-gray-300 w-full rounded px-4 py-2"
          />
        </div>
        <div class="flex flex-col items-start space-y-2">
          <label for="email" class="block mb-2">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            class="border border-gray-300 w-full rounded px-4 py-2"
          />
        </div>
        <div class="flex flex-col items-start space-y-2">
          <label for="phone" class="block mb-2">Phone:</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            class="border border-gray-300 w-full rounded px-4 py-2"
          />
        </div>
      </div>
      <div class="flex justify-start space-x-2 mt-3">
        <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white px-4 py-2 rounded">
          Salvar
        </button>
        <button type="button" class="bg-gray-500 hover:bg-gray-700 text-white px-4 py-2 rounded">
          Cancelar
        </button>
      </div>
    </form>
  </section>
</main>
